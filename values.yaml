services:
  - name: web
    replicaCount: 1
    image: nginx:latest
    containerPort: 80
    path: /
  - name: api
    replicaCount: 1
    image: python:3.9-slim
    containerPort: 8000
    path: /api
  - name: auth
    replicaCount: 1
    image: node:18-slim
    containerPort: 3000
    path: /auth

ingress:
  enabled: true
  className: "nginx"
  host: "myapp.local"

