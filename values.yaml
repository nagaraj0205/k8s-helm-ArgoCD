services:
  - name: web
    replicaCount: 2
    image: nginx:latest
    containerPort: 80
    path: /

  - name: api
    replicaCount: 1
    image: python:3.9-slim
    containerPort: 8000
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.send_header("Content-type", "text/plain")
              self.end_headers()
              self.wfile.write(b"API service is running")

          def log_message(self, format, *args):
              pass

      HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    path: /api

  - name: auth
    replicaCount: 1
    image: node:18-slim
    containerPort: 3000
    command:
      - node
      - -e
      - |
        require('http').createServer((req,res)=>{
          res.end('Auth service running')
        }).listen(3000,'0.0.0.0')
    path: /auth

ingress:
  enabled: true
  className: "nginx"
  host: aa1f6ce2983534da7a8ea025e9a9b42b-728985017.ap-south-2.elb.amazonaws.com
