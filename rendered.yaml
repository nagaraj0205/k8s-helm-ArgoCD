---
# Source: my-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: myapp-web-svc
  labels:
    app: myapp-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: myapp-web
---
# Source: my-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: myapp-api-svc
  labels:
    app: myapp-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: myapp-api
---
# Source: my-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: myapp-auth-svc
  labels:
    app: myapp-auth
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: myapp-auth
---
# Source: my-app/templates/deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-web-deploy
  labels:
    app: myapp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp-web
  template:
    metadata:
      labels:
        app: myapp-web
    spec:
      containers:
        - name: web
          image: nginx:latest
          ports:
            - containerPort: 80
              protocol: TCP
---
# Source: my-app/templates/deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-api-deploy
  labels:
    app: myapp-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-api
  template:
    metadata:
      labels:
        app: myapp-api
    spec:
      containers:
        - name: api
          image: python:3.9-slim
          ports:
            - containerPort: 8000
              protocol: TCP
---
# Source: my-app/templates/deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-auth-deploy
  labels:
    app: myapp-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-auth
  template:
    metadata:
      labels:
        app: myapp-auth
    spec:
      containers:
        - name: auth
          image: node:18-slim
          ports:
            - containerPort: 3000
              protocol: TCP
---
# Source: my-app/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  labels:
    app: myapp

spec:
  ingressClassName: nginx

  rules:
    - host: "myapp.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapp-web-svc
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: myapp-api-svc
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: myapp-auth-svc
                port:
                  number: 80
